spring:
  application:
    name: hotel-availability-ai2
  ai:
    tools:
      limits:
        max-total-tool-calls: 3
        max-calls-per-tool-default: 2
        on-limit-exceeded: THROW
    openai:
      api-key: ${OPENAI_API_KEY}
      max-retries: 0
      timeout: 20s
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
hotel:
  api:
    base-url: ${HOTEL_API_BASE_URL:http://localhost:9090}
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      availability:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - com.example.hotel.exception.AvailabilityBadRequestException
          - com.example.hotel.exception.AvailabilityUpstreamException
          - org.springframework.core.task.TaskRejectedException
  retry:
    retryAspectOrder: 2
    instances:
      availability:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.example.hotel.exception.AvailabilityTransientException
          - java.util.concurrent.TimeoutException
  timelimiter:
    timeLimiterAspectOrder: 3
    instances:
      availability:
        timeoutDuration: 2s
        cancelRunningFuture: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
server:
  shutdown: graceful
